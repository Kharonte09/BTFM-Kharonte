name: Comandos DFIR habituales
summary: One-liners de PowerShell, CLI de Windows, Linux y red para respuesta en vivo y triage. Solo como referencia — ejecútalos en un entorno adecuado.
order: 2
tags: [comandos, powershell, respuesta en vivo, linux, triage]
sections:
  - id: powershell
    title: PowerShell
    note: La respuesta en vivo modifica el sistema. Registra cada comando que ejecutes y prioriza recolectar artefactos frente a explorar de forma interactiva.
    columns: [Comando, Para qué]
    rows:
      - ["Get-FileHash -Algorithm SHA256 .\\sample.bin", 'Calcular el hash de un fichero.']
      - ["Get-ChildItem C:\\Users\\*\\Downloads -Recurse -File | Get-FileHash -Algorithm SHA256", 'Calcular el hash de todos los ficheros de una ruta.']
      - ["Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4624; StartTime=(Get-Date).AddDays(-1)}", 'Consultar eventos recientes por ID en un log en vivo.']
      - ["Get-WinEvent -FilterHashtable @{Path='.\\Security.evtx'; Id=4625}", 'Consultar un fichero .evtx exportado.']
      - ["Get-WinEvent -LogName 'Microsoft-Windows-PowerShell/Operational' -FilterXPath '*[System[EventID=4104]]' -MaxEvents 50", 'Script blocks de PowerShell recientes.']
      - ["Get-Process | Select-Object Id, ProcessName, Path, StartTime", 'Procesos en ejecución con la ruta de la imagen.']
      - ["Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name, CommandLine", 'Procesos con PID del padre y línea de comandos.']
      - ["Get-NetTCPConnection -State Established | Select-Object LocalAddress, LocalPort, RemoteAddress, RemotePort, OwningProcess", 'Conexiones TCP establecidas con el PID propietario.']
      - ["Get-NetTCPConnection -State Listen", 'Puertos a la escucha.']
      - ["Get-DnsClientCache", 'Caché del cliente DNS.']
      - ["Get-ScheduledTask | Where-Object State -ne 'Disabled' | Select-Object TaskPath, TaskName, State", 'Tareas programadas habilitadas.']
      - ["(Get-ScheduledTask -TaskName '<name>').Actions", 'Qué ejecuta una tarea.']
      - ["Get-CimInstance Win32_Service | Select-Object Name, State, StartMode, StartName, PathName", 'Servicios con ruta del binario y cuenta.']
      - ["Get-ItemProperty 'HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Run', 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Run'", 'Autoarranques en claves Run.']
      - ["Get-CimInstance -Namespace root\\subscription -ClassName __EventConsumer", 'Consumidores de eventos WMI (persistencia).']
      - ["Get-LocalUser; Get-LocalGroupMember Administrators", 'Cuentas locales y administradores.']
      - ["Get-Item .\\file.exe -Stream *", 'Listar Alternate Data Streams (ADS).']
      - ["Get-Content .\\file.exe -Stream Zone.Identifier", 'Mark of the Web — origen de la descarga (si existe).']
      - ["Get-AuthenticodeSignature .\\file.exe", 'Estado de la firma y firmante.']
      - ["Get-ChildItem C:\\Users -Recurse -Force -File -ErrorAction SilentlyContinue | Where-Object LastWriteTime -gt (Get-Date).AddDays(-2)", 'Ficheros modificados recientemente en los perfiles de usuario.']
      - ["[Text.Encoding]::Unicode.GetString([Convert]::FromBase64String($b64))", 'Decodificar un valor de `-EncodedCommand` (UTF-16LE) sin ejecutarlo.']
  - id: windows-cli
    title: CLI de Windows
    columns: [Comando, Para qué]
    rows:
      - ['certutil -hashfile sample.bin SHA256', 'Calcular el hash de un fichero.']
      - ['tasklist /v', 'Procesos con usuario y título de ventana.']
      - ['tasklist /svc', 'Servicios alojados en cada proceso.']
      - ['netstat -ano', 'Conexiones y puertos a la escucha con PID.']
      - ['ipconfig /displaydns', 'Caché del cliente DNS.']
      - ['schtasks /query /fo LIST /v', 'Tareas programadas, en detalle.']
      - ['net user · net localgroup administrators', 'Cuentas locales y administradores.']
      - ['query user', 'Sesiones iniciadas (RDP / consola).']
      - ['wevtutil qe Security /q:"*[System[(EventID=4624)]]" /c:20 /rd:true /f:text', 'Últimos 20 eventos de logon.']
      - ['wevtutil epl Security C:\Cases\Security.evtx', 'Exportar un log para análisis offline.']
      - ['autorunsc -accepteula -a * -c -h -s -m > autoruns.csv', 'Autoruns de Sysinternals — todos los autoarranques, CSV, hashes, verificación de firma, ocultar entradas de Microsoft.']
      - ['wmic', 'Obsoleto y eliminado en las builds recientes de Windows — usa `Get-CimInstance` en su lugar.']
  - id: linux
    title: Linux
    columns: [Comando, Para qué]
    rows:
      - ['sha256sum sample.bin', 'Calcular el hash de un fichero.']
      - ['file sample.bin', 'Identificar el tipo por los bytes mágicos.']
      - ['strings -n 8 sample.bin', 'Strings ASCII (longitud mínima 8).']
      - ['strings -el sample.bin', 'Strings UTF-16LE (binarios de Windows).']
      - ['xxd sample.bin | head', 'Vista hexadecimal de la cabecera.']
      - ['ps auxf', 'Árbol de procesos.']
      - ['ss -tunap', 'Sockets con el proceso propietario.']
      - ['last -F · lastb', 'Historial de logons / logons fallidos.']
      - ["journalctl -u ssh --since '2026-01-01'", 'Logs de un servicio en una ventana temporal (la unidad puede llamarse `sshd` en algunas distribuciones).']
      - ['find / -xdev -type f -mtime -2 2>/dev/null', 'Ficheros modificados en los últimos 2 días.']
      - ['crontab -l · ls -la /etc/cron*', 'Persistencia por cron.']
      - ['systemctl list-unit-files --type=service --state=enabled', 'Servicios habilitados.']
      - ['cat ~/.ssh/authorized_keys', 'Persistencia por claves SSH.']
      - ["grep -Eo '([0-9]{1,3}\\.){3}[0-9]{1,3}' file.txt | sort -u", 'Extraer strings con forma de IPv4.']
      - ["jq -r '.[] | .field' data.json", 'Extraer un campo de un array JSON.']
  - id: network
    title: Red
    columns: [Comando, Para qué]
    rows:
      - ['tshark -r capture.pcap -q -z conv,ip', 'Conversaciones IP.']
      - ["tshark -r capture.pcap -Y 'dns.flags.response == 0' -T fields -e frame.time -e ip.src -e dns.qry.name", 'Consultas DNS en forma de tabla.']
      - ["tshark -r capture.pcap -Y 'http.request' -T fields -e ip.src -e http.host -e http.request.uri -e http.user_agent", 'Peticiones HTTP.']
      - ["tshark -r capture.pcap -Y 'tls.handshake.type == 1' -T fields -e ip.dst -e tls.handshake.extensions_server_name", 'Valores SNI de TLS.']
      - ['tshark -r capture.pcap --export-objects http,./out', 'Exportar objetos HTTP (trátalos como malware).']
      - ['zeek -r capture.pcap', 'Generar logs de Zeek (conn, dns, http, ssl…) a partir de una captura.']
      - ['cat conn.log | zeek-cut id.orig_h id.resp_h id.resp_p proto service duration', 'Seleccionar columnas de un log de Zeek.']
