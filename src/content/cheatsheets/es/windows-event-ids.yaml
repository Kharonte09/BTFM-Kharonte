name: Windows Event IDs
summary: Event IDs de Windows de alto valor para investigaciones — Security, System, PowerShell, Sysmon, Task Scheduler, RDP y Defender.
order: 1
tags: [event logs, evtx, sysmon, logons, detección]
sections:
  - id: security
    title: Log de Security
    note: Muchos dependen de la política de auditoría. `4688` solo incluye la línea de comandos si está activado «Incluir la línea de comandos en los eventos de creación de procesos».
    columns: [ID, Evento, Por qué importa]
    rows:
      - ['4624', 'An account was successfully logged on', 'Quién, cuándo y desde dónde. Revisa `LogonType`, IP/estación de origen y el logon ID para correlacionar.']
      - ['4625', 'An account failed to log on', 'Fuerza bruta / password spraying. Revisa los códigos de estado del fallo y el origen.']
      - ['4634', 'An account was logged off', 'Fin de sesión; empareja con `4624` mediante el logon ID.']
      - ['4647', 'User initiated logoff', 'Fin de una sesión interactiva.']
      - ['4648', 'A logon was attempted using explicit credentials', '`runas`, tareas programadas, herramientas de movimiento lateral con credenciales alternativas.']
      - ['4672', 'Special privileges assigned to new logon', 'Logon equivalente a administrador. Correlaciona con el logon ID de `4624`.']
      - ['4688', 'A new process has been created', 'Ejecución de procesos con su padre; línea de comandos si está activada.']
      - ['4697', 'A service was installed in the system', 'Persistencia por servicio / ejecución remota (equivalente en Security de `7045`).']
      - ['4698', 'A scheduled task was created', 'Persistencia por tarea; incluye el XML de la tarea. Requiere la subcategoría de auditoría "Other Object Access Events".']
      - ['4699', 'A scheduled task was deleted', 'Limpieza tras la ejecución.']
      - ['4700 / 4701', 'A scheduled task was enabled / disabled', 'Manipulación de tareas.']
      - ['4702', 'A scheduled task was updated', 'Modificación de tareas existentes para persistencia.']
      - ['4720', 'A user account was created', 'Cuentas puerta trasera.']
      - ['4722', 'A user account was enabled', 'Cuentas inactivas reactivadas.']
      - ['4724', 'An attempt was made to reset an account''s password', 'Toma de control de cuentas por un actor con nivel de administrador.']
      - ['4728 / 4732 / 4756', 'Member added to a global / local / universal security group', 'Escalada de privilegios (p. ej. Domain Admins, Administradores).']
      - ['4738', 'A user account was changed', 'Cambios de atributos (p. ej. la contraseña nunca caduca).']
      - ['4740', 'A user account was locked out', 'Indicador de fuerza bruta; la estación de origen está en el evento.']
      - ['4768', 'A Kerberos TGT was requested', 'Autenticación de dominio en los DC; el tipo de cifrado puede indicar degradación.']
      - ['4769', 'A Kerberos service ticket was requested', 'Kerberoasting (muchas peticiones, cifrado RC4).']
      - ['4771', 'Kerberos pre-authentication failed', 'Adivinación de contraseñas contra Kerberos.']
      - ['4776', 'The computer attempted to validate the credentials for an account', 'Autenticación NTLM (en los DC o en local para cuentas locales).']
      - ['4778 / 4779', 'Session reconnected / disconnected from a Window Station', 'Reconexión / desconexión de RDP.']
      - ['5140', 'A network share object was accessed', 'Acceso a `ADMIN$`, `C$`, `IPC$` — movimiento lateral.']
      - ['5145', 'A network share object was checked to see whether client can be granted desired access', 'Acceso detallado a ficheros compartidos (ruidoso).']
      - ['1102', 'The audit log was cleared', 'Antiforense.']
  - id: system
    title: Log de System
    columns: [ID, Evento, Por qué importa]
    rows:
      - ['7045', 'A service was installed in the system', 'Ejecución remota tipo PsExec y persistencia por servicio. Revisa `ImagePath`.']
      - ['7036', 'Service entered the running / stopped state', 'Timeline de arranques/paradas de servicios; herramientas de seguridad detenidas.']
      - ['7040', 'Service start type changed', 'Desactivación de servicios de seguridad o activación de persistencia.']
      - ['104', 'The event log was cleared', 'Antiforense (logs distintos de Security).']
      - ['6005 / 6006', 'Event log service started / stopped', 'Marcadores de arranque / apagado.']
      - ['1074', 'System shutdown or restart initiated by a process/user', 'Quién o qué reinició el equipo.']
  - id: powershell
    title: PowerShell
    note: '`4103`/`4104` están en `Microsoft-Windows-PowerShell/Operational`; `400`/`403`/`600`/`800` en el log clásico `Windows PowerShell`.'
    columns: [ID, Evento, Por qué importa]
    rows:
      - ['4104', 'Script block logging', 'Contenido del script desofuscado. Los bloques sospechosos se registran con nivel Warning incluso sin política.']
      - ['4103', 'Module / pipeline logging', 'Cmdlets ejecutados con sus parámetros.']
      - ['400 / 403', 'Engine state changed to Available / Stopped', 'Arranque/parada de PowerShell, aplicación anfitriona y línea de comandos; versión del motor (degradación a v2).']
      - ['600', 'Provider started', 'Ciclo de vida de proveedores; incluye detalles de la aplicación anfitriona.']
      - ['800', 'Pipeline execution details', 'Detalle de comandos cuando el module logging está activo.']
  - id: sysmon
    title: Sysmon
    note: Canal `Microsoft-Windows-Sysmon/Operational`. La cobertura depende por completo de la configuración desplegada.
    columns: [ID, Evento, Por qué importa]
    rows:
      - ['1', 'Process creation', 'Línea de comandos, hashes, proceso padre, usuario.']
      - ['2', 'A process changed a file creation time', 'Timestomping.']
      - ['3', 'Network connection', 'Conexiones atribuidas a procesos (a menudo filtradas).']
      - ['4', 'Sysmon service state changed', 'Sysmon detenido / iniciado.']
      - ['5', 'Process terminated', 'Duración de los procesos.']
      - ['6', 'Driver loaded', 'Drivers maliciosos o vulnerables.']
      - ['7', 'Image loaded', 'Carga de DLL — side-loading (ruidoso).']
      - ['8', 'CreateRemoteThread', 'Inyección de código.']
      - ['9', 'RawAccessRead', 'Lecturas en bruto del disco (técnicas de robo de credenciales/NTDS).']
      - ['10', 'ProcessAccess', 'Acceso a `lsass.exe` — credential dumping.']
      - ['11', 'FileCreate', 'Ficheros soltados.']
      - ['12 / 13 / 14', 'Registry object create/delete · value set · key/value rename', 'Persistencia en el registro.']
      - ['15', 'FileCreateStreamHash', 'Alternate Data Streams (ADS), p. ej. `Zone.Identifier` (Mark of the Web).']
      - ['16', 'Sysmon configuration change', 'Manipulación de la monitorización.']
      - ['17 / 18', 'Pipe created / connected', 'Named pipes usadas por frameworks de C2 y movimiento lateral.']
      - ['19 / 20 / 21', 'WMI filter / consumer / binding', 'Persistencia por suscripción de eventos WMI.']
      - ['22', 'DNS query', 'DNS atribuido a procesos.']
      - ['23', 'FileDelete (archived)', 'Ficheros borrados conservados en el directorio de archivo.']
      - ['24', 'Clipboard change', 'Captura del portapapeles (si está configurado).']
      - ['25', 'Process tampering', 'Process hollowing / herpaderping.']
      - ['26', 'FileDeleteDetected', 'Borrados de ficheros registrados sin archivarlos.']
      - ['27 / 28', 'FileBlockExecutable / FileBlockShredding', 'Escrituras de ejecutables / borrado seguro bloqueados.']
      - ['29', 'FileExecutableDetected', 'Se escribió un fichero ejecutable.']
  - id: tasks-rdp-defender
    title: Task Scheduler · RDP · WMI · Defender
    columns: [ID, Log, Por qué importa]
    rows:
      - ['106', 'TaskScheduler/Operational — tarea registrada', 'Nueva tarea programada.']
      - ['140', 'TaskScheduler/Operational — tarea actualizada', 'Modificación de tareas.']
      - ['141', 'TaskScheduler/Operational — tarea eliminada', 'Limpieza.']
      - ['200 / 201', 'TaskScheduler/Operational — acción iniciada / completada', 'Ejecución de la tarea.']
      - ['1149', 'TerminalServices-RemoteConnectionManager/Operational', 'Autenticación de usuario RDP correcta (IP de origen).']
      - ['21 / 22', 'TerminalServices-LocalSessionManager/Operational', 'Logon RDP / inicio del shell.']
      - ['24 / 25', 'TerminalServices-LocalSessionManager/Operational', 'Sesión RDP desconectada / reconectada.']
      - ['5861', 'WMI-Activity/Operational', 'Se registró un consumidor de eventos WMI permanente (persistencia).']
      - ['1116 / 1117', 'Windows Defender/Operational', 'Malware detectado / acción realizada.']
      - ['5001', 'Windows Defender/Operational', 'Protección en tiempo real desactivada.']
  - id: logon-types
    title: Logon types
    columns: [Tipo, Nombre, Origen típico]
    rows:
      - ['2', 'Interactive', 'Logon en consola.']
      - ['3', 'Network', 'SMB, unidades mapeadas, PsExec, WMI y muchas herramientas de administración remota.']
      - ['4', 'Batch', 'Tareas programadas.']
      - ['5', 'Service', 'Servicios que se ejecutan con una cuenta.']
      - ['7', 'Unlock', 'Desbloqueo de la estación.']
      - ['8', 'NetworkCleartext', 'Credenciales enviadas en claro (p. ej. autenticación básica de IIS).']
      - ['9', 'NewCredentials', '`runas /netonly`, algunas herramientas de pass-the-hash.']
      - ['10', 'RemoteInteractive', 'RDP.']
      - ['11', 'CachedInteractive', 'Logon con credenciales de dominio en caché.']
