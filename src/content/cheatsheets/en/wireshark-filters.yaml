name: Wireshark Display Filters
summary: Ready-to-use Wireshark display filters and menus for PCAP analysis — hosts, DNS, HTTP, TLS, credentials, files and C2.
order: 4
tags: [wireshark, pcap, display filters, network, btlo]
sections:
  - id: basics
    title: Basics
    note: Display filters (this sheet) are not the same as capture filters (BPF, e.g. `host 10.0.0.5`). Combine with `&&`, `||`, `!` and parentheses.
    columns: [Filter, What it shows]
    rows:
      - ['ip.addr == 10.0.0.5', 'Traffic to or from a host.']
      - ['ip.src == 10.0.0.5 && ip.dst == 203.0.113.10', 'One direction between two hosts.']
      - ['tcp.port == 4444 || udp.port == 53', 'Traffic on a port (either side).']
      - ['tcp.stream eq 12', 'A single TCP conversation (same as Follow TCP Stream).']
      - ['frame.number == 1234', 'Jump to / reference one packet.']
      - ['frame.time >= "2024-01-15 10:00:00" && frame.time <= "2024-01-15 10:30:00"', 'A time window (use the time format shown in your Wireshark).']
      - ['!(arp || dns || icmp || ssdp || nbns)', 'Hide common noise.']
      - ['frame contains "password"', 'Packets containing a string (case-sensitive; use `matches "(?i)password"` for case-insensitive).']
  - id: hosts
    title: Host identification
    columns: [Filter, What it shows]
    rows:
      - ['dhcp', 'DHCP traffic — `dhcp.option.hostname` gives the client hostname, `eth.src` its MAC.']
      - ['nbns', 'NetBIOS name registrations — hostnames on Windows networks.']
      - ['kerberos.CNameString', 'Kerberos client names — user accounts (and machine accounts ending in `$`).']
      - ['ntlmssp.auth.username', 'NTLM authentication — user and domain names.']
      - ['http.user_agent', 'Browser / OS hints and malware user agents.']
  - id: dns
    title: DNS
    columns: [Filter, What it shows]
    rows:
      - ['dns.flags.response == 0', 'DNS queries only.']
      - ['dns.qry.name contains "example"', 'Queries for a name.']
      - ['dns.qry.type == 16', 'TXT queries (tunnelling, C2).']
      - ['dns.flags.rcode == 3', 'NXDOMAIN answers (DGA, typos, sinkholes).']
      - ['dns.a == 203.0.113.10', 'Answers resolving to a given IP.']
  - id: http
    title: HTTP
    columns: [Filter, What it shows]
    rows:
      - ['http.request', 'All HTTP requests.']
      - ['http.request.method == "POST"', 'Uploads / form posts / C2 check-ins.']
      - ['http.host contains "example"', 'Requests to a host name.']
      - ['http.request.uri contains ".exe"', 'Requests for executables (try `.ps1`, `.hta`, `.zip`, `.dll`).']
      - ['http.response.code == 200 && http.content_type contains "application"', 'Successful binary / document downloads.']
      - ['http.authorization', 'HTTP Basic / other Authorization headers.']
  - id: tls
    title: TLS
    columns: [Filter, What it shows]
    rows:
      - ['tls.handshake.type == 1', 'Client Hello — add the column `tls.handshake.extensions_server_name` (SNI).']
      - ['tls.handshake.extensions_server_name contains "example"', 'TLS sessions to a server name.']
      - ['tls.handshake.type == 11', 'Certificate messages — inspect issuer, subject, validity.']
  - id: credentials
    title: Credentials and cleartext protocols
    columns: [Filter, What it shows]
    rows:
      - ['ftp.request.command == "USER" || ftp.request.command == "PASS"', 'FTP user and password.']
      - ['ftp-data', 'FTP file transfers (export with Follow / Export Objects).']
      - ['smtp.req.command == "AUTH"', 'SMTP authentication (Base64 credentials follow).']
      - ['pop || imap', 'Mail retrieval in cleartext.']
      - ['telnet', 'Telnet sessions — read with Follow TCP Stream.']
      - ['smb2.filename', 'Files accessed over SMB2.']
  - id: hunting
    title: Hunting
    columns: [Filter, What it shows]
    rows:
      - ['tcp.flags.syn == 1 && tcp.flags.ack == 0', 'Connection attempts — many to different ports = scan.']
      - ['tcp.flags.reset == 1', 'Rejected connections / closed ports.']
      - ['tcp.analysis.flags', 'Retransmissions, resets, zero windows — broken or unusual sessions.']
      - ['icmp.type == 8', 'Ping requests (sweeps, ICMP tunnelling).']
      - ['tcp.len > 1000 && ip.src == 10.0.0.5', 'Large outbound payloads from a host (exfiltration).']
  - id: menus
    title: Useful menus
    columns: [Menu, Use]
    mono: []
    rows:
      - ['Statistics → Capture File Properties', 'Time span, packet count, file hashes.']
      - ['Statistics → Protocol Hierarchy', 'Which protocols are present.']
      - ['Statistics → Endpoints / Conversations', 'Top talkers, bytes per host and per conversation.']
      - ['Statistics → HTTP → Requests', 'All requested URLs grouped by host.']
      - ['Statistics → I/O Graphs', 'Traffic over time — beaconing patterns.']
      - ['Analyze → Follow → TCP / HTTP Stream', 'Read a whole conversation.']
      - ['File → Export Objects → HTTP / SMB / FTP-DATA / IMF', 'Recover transferred files (treat as malware).']
      - ['File → Export Specified Packets', 'Save only the relevant packets.']
      - ['Analyze → Expert Information', 'Warnings and errors Wireshark detected.']
      - ['View → Time Display Format → UTC', 'Show timestamps in UTC.']
